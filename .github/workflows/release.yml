# Pushing a tag like v1.0.1 builds the .ipk and the Homebrew Channel manifest and attaches both to a release.
# The catalog entry points at releases/latest/download/<id>.manifest.json, so a release is all an update needs.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the tag matches appinfo.json
        run: test "v$(node -p "require('./appinfo.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install -g @webos-tools/cli@3.2.6
      - run: sh tools/package.sh dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
