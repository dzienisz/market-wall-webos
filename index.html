<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Market Wall</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div id="stage">
  <header id="top"><div class="date" id="date">&nbsp;</div><div class="time num" id="time">--:--</div></header>
  <main id="view"></main>
  <footer id="foot"><div id="status"></div><div id="sources"></div></footer>
  <div id="hint"></div>
</div>

<script src="src/i18n.js"></script>
<script src="src/currency.js"></script>
<script src="src/settings.js"></script>
<script src="src/data.js"></script>
<script src="src/assets.js"></script>
<script src="src/companies.js"></script>
<script src="src/core.js"></script>
<script src="screens/list.js"></script>
<script>
  // Load each screen listed in screens/list.js, in order, then start.
  (function load(i) {
    if (i >= SCREENS.length) { F.boot(); return; }
    var s = document.createElement('script');
    s.src = 'screens/' + SCREENS[i] + '.js';
    s.onload = s.onerror = function () { load(i + 1); };
    document.body.appendChild(s);
  })(0);
</script>
</body>
</html>
